<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>아카이브 임포트</title>
<style>
  :root {
    color-scheme: light dark;
    --accent: #5b6cf0;
    --bg: #fafafa;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #6b7280;
    --border: #e5e7eb;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card: #1d1e25;
      --text: #f2f2f2;
      --muted: #9aa0ac;
      --border: #2c2d36;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Pretendard, sans-serif;
    padding: 24px;
  }
  main {
    width: 100%;
    max-width: 480px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px;
  }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  p.desc { color: var(--muted); font-size: 0.9rem; margin: 0 0 24px; line-height: 1.5; }
  label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  input[type="text"], input[type="file"] {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: transparent;
    color: var(--text);
    font-size: 0.9rem;
    margin-bottom: 18px;
  }
  input[type="text"]:focus, input[type="file"]:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: white;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .progress-wrap {
    display: none;
    height: 6px;
    background: var(--border);
    border-radius: 4px;
    margin-top: 16px;
    overflow: hidden;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.15s ease;
  }
  #status {
    margin-top: 16px;
    font-size: 0.85rem;
    white-space: pre-wrap;
    line-height: 1.6;
  }
  #status.error { color: #dc2626; }
  #status.success { color: #16a34a; }
</style>
</head>
<body>
<main>
  <h1>아카이브 임포트</h1>
  <p class="desc">
    X(트위터) 설정 &gt; 데이터 다운로드에서 받은 zip 파일을 업로드하면
    tweet.js / like.js를 읽어 로컬 DB에 저장합니다. 업로드된 파일은 처리 후 서버에서 즉시 삭제됩니다.
  </p>

  <form id="import-form">
    <label for="ownUsername">본인 X 아이디 (@ 제외, 영문/숫자/밑줄)</label>
    <input type="text" id="ownUsername" name="ownUsername" placeholder="hongildong" pattern="[A-Za-z0-9_]{1,15}" required />

    <label for="archive">아카이브 zip 파일</label>
    <input type="file" id="archive" name="archive" accept=".zip,application/zip" required />

    <button type="submit" id="submit-btn">업로드 및 임포트 시작</button>

    <div class="progress-wrap" id="progress-wrap">
      <div class="progress-bar" id="progress-bar"></div>
    </div>
    <div id="status"></div>
  </form>
</main>

<script>
(function () {
  const form = document.getElementById("import-form");
  const submitBtn = document.getElementById("submit-btn");
  const progressWrap = document.getElementById("progress-wrap");
  const progressBar = document.getElementById("progress-bar");
  const status = document.getElementById("status");

  function setStatus(text, kind) {
    status.textContent = text;
    status.className = kind || "";
  }

  form.addEventListener("submit", function (event) {
    event.preventDefault();

    const usernameInput = document.getElementById("ownUsername");
    const fileInput = document.getElementById("archive");

    if (!fileInput.files || fileInput.files.length === 0) {
      setStatus("파일을 선택하세요.", "error");
      return;
    }

    const formData = new FormData();
    formData.append("ownUsername", usernameInput.value.trim());
    formData.append("archive", fileInput.files[0]);

    submitBtn.disabled = true;
    progressWrap.style.display = "block";
    progressBar.style.width = "0%";
    setStatus("업로드 중...", "");

    const xhr = new XMLHttpRequest();
    xhr.open("POST", "/api/import/archive");

    xhr.upload.addEventListener("progress", function (e) {
      if (e.lengthComputable) {
        const pct = Math.round((e.loaded / e.total) * 100);
        progressBar.style.width = pct + "%";
        if (pct >= 100) {
          setStatus("업로드 완료. 서버에서 처리 중입니다 (트윗 수에 따라 수 분 소요될 수 있어요)...", "");
        }
      }
    });

    xhr.onload = function () {
      submitBtn.disabled = false;
      let body;
      try {
        body = JSON.parse(xhr.responseText);
      } catch (e) {
        setStatus("서버 응답을 해석할 수 없습니다.", "error");
        return;
      }

      if (xhr.status >= 200 && xhr.status < 300) {
        const s = body.summary || {};
        setStatus(
          "임포트 완료\n" +
            "트윗/리트윗: " + s.tweetsImported + "건 (스킵 " + s.tweetsSkipped + "건)\n" +
            "좋아요: " + s.likesImported + "건 (스킵 " + s.likesSkipped + "건)",
          "success",
        );
      } else {
        setStatus("오류: " + (body.error || "임포트에 실패했습니다"), "error");
      }
    };

    xhr.onerror = function () {
      submitBtn.disabled = false;
      setStatus("네트워크 오류로 업로드에 실패했습니다.", "error");
    };

    xhr.send(formData);
  });
})();
</script>
</body>
</html>
